server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ledgercore
  profiles:
    active: dev
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ledgercore}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ledgercore:
  mongodb:
    transactions:
      enabled: ${MONGODB_TRANSACTIONS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours
    refresh-expiration: 604800000 # 7 days
  rate-limit:
    enabled: true
    requests-per-minute: 60
    burst-capacity: 100
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
