spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongo:27017/ledgercore}
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
ledgercore:
  mongodb:
    transactions:
      enabled: ${MONGODB_TRANSACTIONS_ENABLED:true}
logging:
  level:
    com.ledgercore: INFO
    org.springframework.web: WARN
