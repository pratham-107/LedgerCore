services:
  - type: web
    name: ledgercore-api
    runtime: docker
    repo: https://github.com/pratham-107/LedgerCore
    branch: main
    plan: free
    healthCheckPath: /actuator/health
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: MONGODB_TRANSACTIONS_ENABLED
        value: "true"
      - key: JAVA_OPTS
        value: -Xms128m -Xmx350m -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false